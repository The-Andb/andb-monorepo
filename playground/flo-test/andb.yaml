# Andb v4 Configuration for FloStoreProcedureBE
ENVIRONMENTS:
  - LOCAL
  - DEV
  - UAT
  - STAGE
  - PROD

getDBDestination:
  LOCAL:
    type: "file"
    path: "./db/LOCAL/flo_helper"
  UAT_FILES:
    type: "file"
    path: "./db/DEV/flo_helper"
  DEV:
    type: "mysql"
    host: "${DEV_DB_HOST}"
    user: "${DEV_DB_USERNAME}"
    password: "${DEV_DB_PASSWORD}"
    database: "${DEV_DB_NAME}"
  UAT:
    type: "mysql"
    host: "${UAT_DB_HOST}"
    user: "${UAT_DB_USERNAME}"
    password: "${UAT_DB_PASSWORD}"
    database: "${UAT_DB_NAME}"
  STAGE:
    type: "mysql"
    host: "${STAGE_DB_HOST}"
    user: "${STAGE_DB_USERNAME}"
    password: "${STAGE_DB_PASSWORD}"
    database: "${STAGE_DB_NAME}"
  PROD:
    type: "mysql"
    host: "${PROD_DB_HOST}"
    user: "${PROD_DB_USERNAME}"
    password: "${PROD_DB_PASSWORD}"
    database: "${PROD_DB_NAME}"

# Migration mapping (legacy parity)
# LOCAL -> DEV -> UAT -> STAGE -> PROD
MIGRATION_FLOW:
  DEV: LOCAL
  UAT: DEV
  STAGE: UAT
  PROD: STAGE

# Logic for replaceWithEnv
domainNormalization:
  UAT_FILES:
    pattern: "@flodev.net"
    replacement: "@flouat.net"
  UAT:
    pattern: "@flodev.net"
    replacement: "@flouat.net"
  STAGE:
    pattern: "@flouat.net"
    replacement: "@flostage.com"
  PROD:
    pattern: "@flostage.com"
    replacement: "@flomail.net"

autoBackup: false
