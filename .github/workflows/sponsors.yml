name: Sync Sponsors

on:
  schedule:
    - cron: '17 4 * * *' # daily, off the hour to avoid GitHub Actions load spikes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch sponsors and update docs
        env:
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: node scripts/sync-sponsors.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md SPONSORS.md docs/sponsors.json
          git diff --cached --quiet || git commit -m "chore(sponsors): sync sponsor data [skip ci]"
          git push
